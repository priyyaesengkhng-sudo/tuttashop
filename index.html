<!DOCTYPE html>
<html lang="th"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tutta Shop</title>
<style>
:root{--bg:#f4f5fb;--card:#fff;--tx:#1b1d2a;--mut:#6b7090;--pri:#6c4cf5;--ok:#17a34a;--wa:#d97706;--bd:#e2e4f0;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12131c;--card:#1c1e2b;--tx:#eceefa;--mut:#9aa0c4;--bd:#2c2f44}}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,"Noto Sans Thai",sans-serif}
.w{max-width:560px;margin:auto;padding:14px}
.c{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:14px;margin:10px 0}
h1{font-size:20px;margin:6px 0}h2{font-size:16px;margin:0 0 8px}
input{width:100%;padding:11px;margin:5px 0;border:1px solid var(--bd);border-radius:10px;background:var(--bg);color:var(--tx);font-size:15px}
label.r{display:flex;gap:8px;align-items:center;font-size:14px;color:var(--mut);margin:6px 0}label.r input{width:auto;margin:0}
button{background:var(--pri);color:#fff;border:0;border-radius:10px;padding:10px 14px;font-size:14px;cursor:pointer}
button.g{background:var(--bd);color:var(--tx)}button.o{background:var(--ok)}button.x{background:#dc2626}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px}
.tabs{display:flex;gap:6px;overflow-x:auto}.tabs button{background:var(--card);color:var(--tx);border:1px solid var(--bd);white-space:nowrap}.tabs button.on{background:var(--pri);color:#fff}
.bal{font-size:28px;font-weight:700;color:var(--pri)}.m{color:var(--mut);font-size:13px}
.b{font-size:12px;padding:2px 8px;border-radius:99px;color:#fff}.b.p{background:var(--wa)}.b.k{background:var(--ok)}.b.n{background:#dc2626}
code{background:var(--bg);padding:3px 7px;border-radius:6px;word-break:break-all}
.hero{position:relative;text-align:center;padding:18px 10px 14px;border-radius:16px;color:#fff;overflow:hidden;background:repeating-conic-gradient(from 0deg at 50% 45%,rgba(255,255,255,.14) 0 1deg,transparent 1deg 22.5deg),radial-gradient(circle at 50% 45%,#e11d2e 0,#8a1020 42%,#0b2a6f 100%)}
.hero h1{font-size:26px;letter-spacing:3px;margin:6px 0 2px;text-shadow:0 2px 8px #0008}.hero .m{color:#ffe;opacity:.9}
.sp{width:130px;height:130px;margin:auto;border-radius:50%;background:#0003;display:flex;align-items:center;justify-content:center;font-size:64px;overflow:hidden;border:3px solid #fff}
.sp img,.badge img{width:100%;height:100%;object-fit:cover}
.badge{position:absolute;right:12px;top:12px;width:56px;height:56px;border-radius:50%;background:#facc15;display:flex;align-items:center;justify-content:center;font-size:28px;overflow:hidden;border:2px solid #fff}
.modes{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:10px 0}.modes button{background:var(--card);color:var(--tx);border:2px solid var(--bd);padding:14px 8px;font-weight:700}.modes button.on{border-color:var(--pri);background:var(--pri);color:#fff}
button{border-radius:99px}.c{border-radius:22px;box-shadow:0 6px 18px #6c4cf522}.modes button{border-radius:22px}
body::before,body::after{content:"";position:fixed;border-radius:50%;background:radial-gradient(circle at 30% 30%,#fffa,#8be9fd66);z-index:-1;animation:fl 8s ease-in-out infinite}
body::before{width:140px;height:140px;left:-30px;top:30%}body::after{width:90px;height:90px;right:-20px;top:60%;animation-delay:-4s}@keyframes fl{50%{transform:translateY(-30px)}}
.hide{display:none}
</style></head><body><div class="w" id="app"></div>
<script>
const mem={};
const L=k=>{try{const v=localStorage.getItem(k);return v?JSON.parse(v):null}catch(e){return mem[k]||null}};
const S=(k,v)=>{mem[k]=v;try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}};
const SS={get:()=>{try{return sessionStorage.getItem('sess')}catch(e){return mem.s}},set:v=>{mem.s=v;try{sessionStorage.setItem('sess',v)}catch(e){}}};
const H=async s=>[...new Uint8Array(await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s)))].map(b=>b.toString(16).padStart(2,'0')).join('');
const PHONE='095-381-0539',ADMIN='sms:0953810539';let md='Bluetooth';
const MODES=['Bluetooth','Block Speed','ROV','Map อื่นๆ','รับฟาร์ม'];
const img=(s,f)=>s?`<img src="${s}" alt="">`:f;
const hero=()=>`<div class="hero"><div class="badge">${img(db.img&&db.img.badge,'⚡')}</div><div class="sp">${img(db.img&&db.img.hero,'🕷️')}</div><h1>TUTTA SHOP</h1><div class="m">ร้านขายรหัสเกม · ซื้อแล้วทักแอดมินได้เลย</div></div>`;
const PRODUCTS=[{id:1,m:'Bluetooth',n:'รหัส Bluetooth 1 วัน',p:49,pre:'BT1'},{id:2,m:'Bluetooth',n:'รหัส Bluetooth 7 วัน',p:149,pre:'BT7'},{id:3,m:'Block Speed',n:'รหัส Block Speed 1 วัน',p:59,pre:'BS1'},{id:4,m:'Block Speed',n:'รหัส Block Speed 7 วัน',p:179,pre:'BS7'},{id:5,m:'ROV',n:'รหัส ROV คูปอง 500',p:150,pre:'ROV'},{id:6,m:'ROV',n:'รหัส ROV คูปอง 1000',p:290,pre:'ROV'},{id:7,m:'Map อื่นๆ',n:'โค้ด Map พิเศษ 1 ชุด',p:79,pre:'MAP'},{id:8,m:'Map อื่นๆ',n:'โค้ด Roblox Gift 100',p:100,pre:'RBX'},{id:9,m:'รับฟาร์ม',n:'รับฟาร์มรหัส 1 วัน',p:120,pre:'FARM'},{id:10,m:'รับฟาร์ม',n:'รับฟาร์มรหัส 7 วัน',p:690,pre:'FARM'}];
let db=L('db')||{users:{},topups:[],orders:[]},me=null,tab='shop',mode='in';
H('admin123').then(h=>{if(!db.users.admin)db.users.admin={pw:h,bal:0,role:'admin'};if(!db.f1k){db.users.admin.bal+=1000;db.f1k=1}S('db',db);if(me)render()})
const save=()=>S('db',db);
const fmt=t=>new Date(t).toLocaleString('th-TH');
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
async function boot(){let s=L('sess')||SS.get();if(s&&db.users[s])me=s;render()}
function render(){document.getElementById('app').innerHTML=(me?dash():auth())+ov()}
let closed=L('closed'),showAdm=false;
const isClosed=()=>closed&&closed.on&&(!closed.until||Date.now()<closed.until);
const ov=()=>isClosed()&&!((me&&db.users[me].role=='admin')||(showAdm&&!me))?`<div style="position:fixed;inset:0;z-index:99;background:#000c;display:flex;align-items:center;justify-content:center;padding:20px"><div class="c" style="text-align:center;max-width:340px"><div style="font-size:48px">🔒</div><h2>TUTTA SHOP ปิดชั่วคราว</h2><p>${esc(closed.reason||'')}</p><p><b>เปิดอีกครั้ง: ${closed.until?fmt(closed.until):'ไม่ระบุ'}</b></p><button class="g" onclick="showAdm=true;render()">แอดมิน</button></div></div>`:'';
function setClosed(c){closed=c;S('closed',c);(async()=>{try{const d=await claude.use('db');if(d)await d.doc('shop/status').set(c)}catch(e){}})();render()}
function cls(d){const u=d?Date.now()+864e5:(v('cu')?new Date(v('cu')).getTime():0);setClosed({on:true,reason:v('cr').trim()||'ปิดปรับปรุง',until:u})}
(async()=>{try{const d=await claude.use('db');if(!d)return;d.doc('shop/status').onSnapshot(s=>{if(s.exists&&JSON.stringify(s.data())!=JSON.stringify(closed)){closed=s.data();S('closed',closed);render()}})}catch(e){}})();
function auth(){return`${hero()}<div class="c"><div class="tabs"><button class="${mode=='in'?'on':''}" onclick="mode='in';render()">เข้าสู่ระบบ</button><button class="${mode=='up'?'on':''}" onclick="mode='up';render()">สมัครสมาชิก</button></div>
<input id="u" placeholder="ชื่อผู้ใช้" autocomplete="username"><input id="p" type="password" placeholder="รหัสผ่าน (อย่างน้อย 6 ตัว)" autocomplete="current-password">
${mode=='up'?'<input id="p2" type="password" placeholder="ยืนยันรหัสผ่าน">':'<label class="r"><input type="checkbox" id="rm" checked>จดจำบัญชีนี้ไว้</label>'}
<button style="width:100%" onclick="${mode=='in'?'login()':'reg()'}">${mode=='in'?'เข้าสู่ระบบ':'สมัครสมาชิก'}</button><p class="m" id="msg"></p></div>`}
const msg=t=>document.getElementById('msg').textContent=t;
async function reg(){const u=v('u').trim(),p=v('p');if(!/^[\w.-]{3,20}$/.test(u))return msg('ชื่อผู้ใช้ 3-20 ตัว (a-z, 0-9)');if(p.length<6)return msg('รหัสผ่านสั้นเกินไป');if(p!=v('p2'))return msg('รหัสผ่านไม่ตรงกัน');if(db.users[u])return msg('ชื่อนี้ถูกใช้แล้ว');db.users[u]={pw:await H(p),bal:0,role:'user'};save();mode='in';render();msg('สมัครสำเร็จ! เข้าสู่ระบบได้เลย')}
async function login(){const u=v('u').trim(),a=db.users[u];if(!a||a.pw!=await H(v('p')))return msg('ชื่อผู้ใช้หรือรหัสผ่านไม่ถูกต้อง');me=u;if(document.getElementById('rm').checked)S('sess',u);else{try{localStorage.removeItem('sess')}catch(e){}SS.set(u)}tab='shop';render()}
function logout(){me=null;try{localStorage.removeItem('sess');sessionStorage.removeItem('sess')}catch(e){}render()}
const v=i=>document.getElementById(i).value;
function dash(){const a=db.users[me];const T=[['shop','🛒 ร้านค้า'],['top','💰 เติมเงิน'],['his','📜 ประวัติ']];if(a.role=='admin')T.push(['adm','🛠 แอดมิน']);
return`${hero()}<div class="row" style="margin-top:10px"><b>สวัสดี ${esc(me)}</b><button class="g" onclick="logout()">ออก</button></div>
<div class="c"><div class="m">ยอดเงินคงเหลือ</div><div class="bal">฿${a.bal.toLocaleString()}</div></div>
<div class="tabs">${T.map(t=>`<button class="${tab==t[0]?'on':''}" onclick="tab='${t[0]}';render()">${t[1]}</button>`).join('')}</div>${view()}`}
function view(){const a=db.users[me];
if(tab=='shop')return`<div class="modes">${MODES.map(x=>`<button class="${md==x?'on':''}" onclick="md='${x}';render()">${x}</button>`).join('')}</div>`+PRODUCTS.filter(p=>p.m==md).map(p=>`<div class="c row"><div><b>${p.n}</b><div class="m">฿${p.p}</div></div><button onclick="buy(${p.id})">ซื้อ</button></div>`).join('');
if(tab=='top'){const mine=db.topups.filter(t=>t.user==me).reverse();return`<div class="c"><h2>เติมเงิน</h2><p>1) โอนเงินเข้าเบอร์ <b>${PHONE}</b></p><p>2) กรอกจำนวนเงินและเวลาที่โอน/เลขอ้างอิง</p><input id="am" type="number" min="1" placeholder="จำนวนเงิน (บาท)"><input id="rf" placeholder="เลขอ้างอิงรายการ / เวลาที่โอน"><button onclick="topup()">แจ้งโอนเงิน</button><p class="m" id="msg"></p></div>
<div class="c"><h2>สถานะการตรวจสอบ</h2>${mine.map(t=>`<div class="row" style="margin:6px 0"><span>฿${t.amt} <span class="m">${fmt(t.time)}</span></span>${bd(t.status)}</div>`).join('')||'<p class="m">ยังไม่มีรายการ</p>'}</div>`}
if(tab=='his'){const o=db.orders.filter(t=>t.user==me).reverse();return o.map(t=>`<div class="c"><b>${esc(t.item)}</b> · ฿${t.price}<div class="m">${fmt(t.time)}</div>รหัส: <code>${t.code}</code><div style="margin-top:8px"><a href="${ADMIN}"><button class="o">💬 ได้โค้ดแล้ว ทักแอดมิน</button></a></div></div>`).join('')||'<div class="c m">ยังไม่มีประวัติการสั่งซื้อ</div>'}
if(tab=='adm'){const p=db.topups.filter(t=>t.status=='p');return`<div class="c"><h2>🔒 ปิดร้านชั่วคราว</h2>${isClosed()?`<p><b>ตอนนี้ปิดอยู่</b> จนถึง ${closed.until?fmt(closed.until):'-'}`+'</p>':'<p class="m">ตอนนี้ร้านเปิดอยู่</p>'}<input id="cr" placeholder="เหตุผล เช่น ไปเที่ยว"><input id="cu" type="datetime-local"><div class="row"><button class="x" onclick="cls()">ปิดร้าน</button><button class="g" onclick="cls(1)">ปิด 1 วัน</button><button class="o" onclick="setClosed({on:false})">เปิดร้าน</button></div></div><div class="c"><h2>รูปหน้าร้าน</h2><p class="m">อัปโหลดรูปสไปเดอร์แมนตรงกลาง และรูปสีเหลืองมุมขวา</p><input type="file" accept="image/*" onchange="up('hero',this)"><input type="file" accept="image/*" onchange="up('badge',this)"></div><div class="c"><h2>รายการรอตรวจสอบ (${p.length})</h2><p class="m">ตรวจยอดโอนเข้าเบอร์ ${PHONE} แล้วกดอนุมัติ</p>${p.map(t=>`<div class="c"><b>${esc(t.user)}</b> ฿${t.amt}<div class="m">อ้างอิง: ${esc(t.ref)} · ${fmt(t.time)}</div><div class="row" style="margin-top:8px"><button class="o" onclick="dec(${t.id},'k')">อนุมัติ</button><button class="x" onclick="dec(${t.id},'n')">ปฏิเสธ</button></div></div>`).join('')||'<p class="m">ไม่มีรายการ</p>'}</div>`}}
const bd=s=>s=='k'?'<span class="b k">✔ ตรวจสอบแล้ว</span>':s=='n'?'<span class="b n">ไม่ผ่าน</span>':'<span class="b p">⏳ รอตรวจสอบ</span>';
function topup(){const am=+v('am'),rf=v('rf').trim();if(!(am>0))return msg('กรอกจำนวนเงิน');if(!rf)return msg('กรอกเลขอ้างอิง');if(db.topups.some(t=>t.ref==rf))return msg('เลขอ้างอิงนี้ถูกใช้แล้ว');db.topups.push({id:Date.now(),user:me,amt:am,ref:rf,time:Date.now(),status:'p'});save();render()}
function dec(id,s){const t=db.topups.find(x=>x.id==id);if(!t||t.status!='p')return;t.status=s;if(s=='k')db.users[t.user].bal+=t.amt;save();render()}
function buy(id){const p=PRODUCTS.find(x=>x.id==id),a=db.users[me];if(a.bal<p.p){alert('ยอดเงินไม่พอ กรุณาเติมเงิน');tab='top';return render()}
const r=()=>Math.random().toString(36).slice(2,6).toUpperCase();a.bal-=p.p;const code=`${p.pre}-${r()}-${r()}-${r()}`;db.orders.push({id:Date.now(),user:me,item:p.n,price:p.p,code,time:Date.now()});save();tab='his';render()}
function up(k,el){const f=el.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{const i=new Image();i.onload=()=>{const c=document.createElement('canvas'),s=Math.min(1,500/Math.max(i.width,i.height));c.width=i.width*s;c.height=i.height*s;c.getContext('2d').drawImage(i,0,0,c.width,c.height);db.img=db.img||{};db.img[k]=c.toDataURL('image/jpeg',.8);save();render()};i.src=r.result};r.readAsDataURL(f)}
boot();
</script></body></html>
